# ==============================================================================
# Cloudflare Pages / Workers Configuration for Kept Photo Booth
# ==============================================================================

name = "kept-photo-booth"
compatibility_date = "2024-01-01"
pages_build_output_dir = "."

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "kept_photobooth_db"
database_id = "KEPT_D1_DATABASE_ID" # Run: npx wrangler d1 create kept_photobooth_db

# Cloudflare KV Storage Binding (Optional Edge Cache)
[[kv_namespaces]]
binding = "BOOTH_KV"
id = "KEPT_KV_NAMESPACE_ID"
